networks:
  challenge_net:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 172.18.0.0/16
        gateway: 172.18.0.1
  ctfd_net:
    driver: bridge
    ipam:
      config:
      - subnet: 172.19.0.0/16
        gateway: 172.19.0.1
services:
  ctfd:
    image: ctfd/ctfd:latest
    restart: unless-stopped
    ports:
    - 127.0.0.1:8000:8000
    environment:
    - UPLOAD_FOLDER=/var/uploads
    - DATABASE_URL=mysql+pymysql://ctfd:${CTFD_DB_PASSWORD:-changeme}@ctfd_db/ctfd
    - REDIS_URL=redis://ctfd_cache:6379
    depends_on:
    - ctfd_db
    - ctfd_cache
    networks:
    - ctfd_net
    volumes:
    - ctfd_uploads:/var/uploads
  ctfd_db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=${CTFD_DB_ROOT_PASSWORD:-changeme_root}
    - MYSQL_USER=ctfd
    - MYSQL_PASSWORD=${CTFD_DB_PASSWORD:-changeme}
    - MYSQL_DATABASE=ctfd
    networks:
    - ctfd_net
    volumes:
    - ctfd_db_data:/var/lib/mysql
  ctfd_cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
    - ctfd_net
  stage1-2-evidence:
    build: ./stage1-2-evidence
    restart: unless-stopped
    ports:
    - 127.0.0.1:8081:80
    networks:
      challenge_net:
        ipv4_address: 172.18.0.3
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    tmpfs:
    - /var/cache/nginx
    - /var/run
    - /tmp
  stage3-portal:
    build: ./stage3-portal
    environment:
      VULN_MODE: ${VULN_MODE:-sqli}
      FLASK_SECRET: ${FLASK_SECRET:?Set FLASK_SECRET in .env}
    restart: unless-stopped
    ports:
    - 127.0.0.1:8083:5000
    networks:
      challenge_net:
        ipv4_address: 172.18.0.5
    cap_drop:
    - ALL
  stage4-5-files:
    build: ./stage4-crypto
    restart: unless-stopped
    ports:
    - 127.0.0.1:8085:80
    networks:
      challenge_net:
        ipv4_address: 172.18.0.4
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    tmpfs:
    - /var/cache/nginx
    - /var/run
    - /tmp
  stage6-staging:
    build: ./stage6-staging
    restart: unless-stopped
    ports:
    - 127.0.0.1:2222:22
    networks:
      challenge_net:
        ipv4_address: 172.18.0.2
    security_opt:
    - no-new-privileges:false
volumes:
  ctfd_uploads: null
  ctfd_db_data: null
