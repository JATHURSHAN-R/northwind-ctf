<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northwind Logistics -- Internal Portal</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#e9edf1;margin:0;padding:0}
  .header{background:#1f3a5f;color:#fff;padding:14px 24px;font-size:1.1em;
       display:flex;justify-content:space-between}
  .header a{color:#cdd8e6;text-decoration:none;font-size:0.85em}
  .box{max-width:520px;margin:40px auto;background:#fff;border:1px solid #ccc;
       border-radius:4px;padding:20px}
  h2{margin-top:0;font-size:1.05em;color:#1f3a5f}
  ul{list-style:none;padding:0}
  li{border-bottom:1px solid #eee;padding:10px 4px}
  li a{color:#1f3a5f;text-decoration:none}
  li a:hover{text-decoration:underline}
  .msgid{color:#999;font-size:0.8em;margin-left:6px}
</style>
</head>
<body>
<div class="header">
  <span>Northwind Logistics &mdash; Internal Portal</span>
  <span>{{ name }} &nbsp; <a href="/logout">log out</a></span>
</div>
<div class="box">
  <h2>Your messages</h2>
  <ul>
    {% for m in messages %}
    <li><a href="/message/{{ m.id }}">{{ m.subject }}</a><span class="msgid">#{{ m.id }}</span></li>
    {% else %}
    <li>No messages.</li>
    {% endfor %}
  </ul>
</div>
</body></html>
